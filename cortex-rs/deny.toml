# cargo-deny config — CORTEX Rust supply-chain gate.
# Run via scripts/preflight-security.sh. Enforces: no security advisories, no
# unknown sources, only permissive/weak-copyleft licenses.

[advisories]
yanked = "deny"
# No ignored advisories — the tree is kept on patched crates (pyo3 >=0.29 clears
# RUSTSEC-2025-0020 and RUSTSEC-2026-0176). Add an entry here ONLY with a written
# justification if an advisory is ever provably non-exploitable.
ignore = []

[bans]
multiple-versions = "allow"   # transitive duplicates are common (reqwest/tokio tree)
wildcards = "allow"

[licenses]
# Permissive + weak-copyleft licenses we accept. Anything else fails the gate.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Our own crate is private (publish = false) — don't license-check it.
private = { ignore = true }

[sources]
# Only crates.io — no unknown git/registry sources may enter the build.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

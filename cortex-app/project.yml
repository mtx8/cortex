name: CortexApp
options:
  bundleIdPrefix: com.cortex
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  CortexCore:
    path: .

targets:
  CortexApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/CortexApp
    dependencies:
      - package: CortexCore
        product: CortexCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cortex.app
        PRODUCT_NAME: CortexApp
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.finance"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
